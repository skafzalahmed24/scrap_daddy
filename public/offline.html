<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#3D8B4D">
    <title>You're offline - Scrapdaddy</title>
    <style>
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#F4FCF4; font:16px/1.5 -apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif; color:#14201A; text-align:center; padding:24px; }
        .card { background:#fff; border:1px solid #D8E8D9; border-radius:24px; padding:32px 24px; max-width:360px; box-shadow:0 10px 30px rgba(15,23,42,.06); }
        img { width:120px; height:auto; margin-bottom:12px; }
        h1 { font-size:1.3rem; margin:0 0 8px; }
        p { color:#64748B; margin:0 0 20px; }
        button { background:#3D8B4D; color:#fff; border:0; border-radius:14px; padding:13px 26px; font-weight:700; font-size:1rem; cursor:pointer; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/sd_logo_mark.png" alt="Scrapdaddy">
        <h1>You're offline</h1>
        <p>Check your internet connection and try again. Your pickups and payments are safe.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
